<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantGuard AI — Plant Disease Detection</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style_v2.css') }}" rel="stylesheet">
</head>

<body>
    <!-- ── Navbar ──────────────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="brand-icon">🌿</span>
                <span class="brand-text">PlantGuard <span class="brand-ai">AI</span></span>
            </a>
            <div class="nav-badge">
                <i class="bi bi-cpu"></i> Deep Learning Powered
            </div>
        </div>
    </nav>

    <!-- ── Main Content ───────────────────────────────────────── -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Footer ─────────────────────────────────────────────── -->
    <footer class="site-footer">
        <div class="container text-center">
            <p class="mb-1">
                <span class="brand-icon-sm">🌿</span>
                PlantGuard AI — Plant Disease Detection System
            </p>
            <p class="text-muted small mb-0">
                Built with TensorFlow &amp; Flask &bull; CNN Image Classification &bull; 3 Disease Classes
            </p>
        </div>
    </footer>

    <!-- ── Scripts ─────────────────────────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
